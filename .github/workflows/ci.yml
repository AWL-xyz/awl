name: Awl source validation
on: [push, pull_request, workflow_dispatch]
jobs:
  linux-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build the contributor compiler, not a release SDK
        run: python3 compiler/build_native.py --standalone --strip
      - name: Check embedded runtime templates
        run: python3 compiler/generate_runtime.py --check
      - name: Check embedded platform helpers
        run: python3 compiler/generate_platform.py --check
      - name: Function declarations and generated native execution
        run: python3 tests/aesop.py --acc compiler/native/bin/acc --report tests/aesop-checks.json
      - name: Generated-program sanitizers
        run: python3 tests/aesop.py --sanitize-programs --report tests/aesop-program-sanitizers.json
      - name: Local time Package with generated-program sanitizers
        run: python3 tests/aesop_time.py --acc compiler/native/bin/acc --sanitize --report tests/aesop-time.json
      - name: Offline editor interpreter and bundled examples
        run: python3 tests/awl_editor.py --acc compiler/native/bin/acc --report tests/aesop-editor.json
      - name: Native ownership and independent-verifier gates with sanitizers
        run: python3 compiler/test_native.py --sanitize --report tests/aesop-native.json.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aesop-source-evidence
          path: |
            tests/aesop-checks.json
            tests/aesop-editor.json
            tests/aesop-program-sanitizers.json
            tests/aesop-time.json
            tests/aesop-native.json.gz
