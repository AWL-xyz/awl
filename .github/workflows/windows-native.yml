name: Windows Aesop frontend preview, not SDK acceptance
on: [workflow_dispatch]
jobs:
  frontend-preview:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Select the contributor MinGW compiler
        shell: pwsh
        run: '"C:\msys64\mingw64\bin" >> $env:GITHUB_PATH'
      - name: Build the source frontend only
        run: python compiler/build_native.py --standalone --strip
      - name: Check Aesop source, not a complete installed SDK
        run: compiler/native/bin/acc.exe check examples/collections/main.aw
